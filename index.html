<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rolex 3D Watch Animation</title>
    <style>
      :root {
        --bg: #060a10;
        --bg-2: #0d1320;
        --navy: #0f1723;
        --gold-1: #f7df9d;
        --gold-2: #d6a95c;
        --gold-3: #866126;
        --silver-1: #e8edf8;
        --silver-2: #9aa7bb;
        --text: #edf4ff;
        --muted: #a7b5c8;
        --line: rgba(255,255,255,0.08);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background:
          radial-gradient(circle at 20% 15%, rgba(247,223,157,0.18), transparent 18%),
          radial-gradient(circle at 80% 80%, rgba(105,146,196,0.18), transparent 20%),
          linear-gradient(180deg, #04070b 0%, #0a0d13 45%, #0d1219 100%);
        color: var(--text);
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .scene {
        position: relative;
        width: min(100%, 1200px);
        height: 100vh;
        min-height: 760px;
        overflow: hidden;
        display: grid;
        place-items: center;
      }

      .scene::before,
      .scene::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        filter: blur(30px);
      }

      .scene::before {
        width: 600px;
        height: 600px;
        left: -140px;
        top: -60px;
        background: radial-gradient(circle, rgba(247,223,157,0.22), transparent 65%);
        animation: pulse 6s ease-in-out infinite;
      }

      .scene::after {
        width: 700px;
        height: 700px;
        right: -200px;
        bottom: -150px;
        background: radial-gradient(circle, rgba(116,154,201,0.18), transparent 65%);
        animation: pulse 8s ease-in-out infinite reverse;
      }

      .watch-wrap {
        position: relative;
        width: min(90vw, 850px);
        height: min(78vh, 760px);
        display: grid;
        place-items: center;
        perspective: 1800px;
        transform-style: preserve-3d;
      }

      .brand {
        position: absolute;
        top: 7%;
        left: 50%;
        transform: translateX(-50%);
        text-transform: uppercase;
        letter-spacing: 1.2rem;
        font-size: 0.78rem;
        color: rgba(247,223,157,0.9);
        text-shadow: 0 0 18px rgba(247,223,157,0.5);
        z-index: 20;
      }

      .watch {
        position: relative;
        width: 520px;
        height: 520px;
        transform-style: preserve-3d;
        animation: floatWatch 8s ease-in-out infinite;
      }

      .watch-shell {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        transform: rotateX(62deg) rotateY(-24deg) rotateZ(-8deg);
      }

      .watch-band {
        position: absolute;
        left: 50%;
        width: 180px;
        height: 235px;
        transform: translateX(-50%);
        background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(8,12,17,0.8));
        border: 1px solid rgba(255,255,255,0.08);
        box-shadow: inset 0 0 18px rgba(255,255,255,0.06), 0 30px 50px rgba(0,0,0,0.35);
      }

      .watch-band.top {
        top: -8px;
        border-radius: 34px 34px 18px 18px;
      }

      .watch-band.bottom {
        bottom: -8px;
        border-radius: 18px 18px 34px 34px;
      }

      .watch-band::before {
        content: "";
        position: absolute;
        inset: 16px 20px;
        border-radius: 20px;
        background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(12,18,25,0.8));
      }

      .watch-case {
        position: absolute;
        inset: 70px 58px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: linear-gradient(135deg, rgba(247,223,157,0.7), rgba(157,120,60,0.88), rgba(40,45,54,0.94));
        border: 12px solid rgba(228,200,143,0.92);
        box-shadow:
          inset 0 0 0 6px rgba(17,21,28,0.85),
          inset 0 0 0 18px rgba(255,255,255,0.12),
          0 30px 50px rgba(0,0,0,0.38);
        transform: translateZ(28px);
        overflow: hidden;
      }

      .watch-case::before {
        content: "";
        position: absolute;
        inset: 12px;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.18);
      }

      .watch-case::after {
        content: "";
        position: absolute;
        inset: 30px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.14);
      }

      .bezel-ring {
        position: absolute;
        inset: 22px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 18%, rgba(255,255,255,0.65), rgba(213,177,111,0.18) 24%, rgba(0,0,0,0.2) 58%, rgba(8,10,16,0.85));
        border: 1px solid rgba(255,255,255,0.16);
        box-shadow: inset 0 0 25px rgba(255,255,255,0.08), inset 0 0 40px rgba(0,0,0,0.32);
      }

      .watch-face {
        position: absolute;
        width: 78%;
        height: 78%;
        border-radius: 50%;
        background:
          radial-gradient(circle at 35% 30%, rgba(255,255,255,0.9), rgba(236,230,217,0.8) 12%, rgba(193,170,136,0.7) 25%, rgba(15,20,28,0.96) 68%, rgba(2,5,8,1) 100%);
        box-shadow: inset 0 0 0 2px rgba(255,255,255,0.14), inset 0 0 30px rgba(0,0,0,0.4);
        overflow: hidden;
      }

      .watch-face::before {
        content: "";
        position: absolute;
        inset: 16px;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.15);
      }

      .watch-face::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(120deg, rgba(255,255,255,0.18), transparent 20%, transparent 72%, rgba(255,255,255,0.15));
      }

      .marker {
        position: absolute;
        top: 10%;
        left: 50%;
        width: 4px;
        height: 18px;
        border-radius: 10px;
        background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(156,126,81,0.8));
        transform-origin: center 150px;
        box-shadow: 0 0 8px rgba(255,255,255,0.2);
      }

      .marker:nth-child(1) { transform: translateX(-50%) rotate(0deg); }
      .marker:nth-child(2) { transform: translateX(-50%) rotate(30deg); }
      .marker:nth-child(3) { transform: translateX(-50%) rotate(60deg); }
      .marker:nth-child(4) { transform: translateX(-50%) rotate(90deg); }
      .marker:nth-child(5) { transform: translateX(-50%) rotate(120deg); }
      .marker:nth-child(6) { transform: translateX(-50%) rotate(150deg); }
      .marker:nth-child(7) { transform: translateX(-50%) rotate(180deg); }
      .marker:nth-child(8) { transform: translateX(-50%) rotate(210deg); }
      .marker:nth-child(9) { transform: translateX(-50%) rotate(240deg); }
      .marker:nth-child(10) { transform: translateX(-50%) rotate(270deg); }
      .marker:nth-child(11) { transform: translateX(-50%) rotate(300deg); }
      .marker:nth-child(12) { transform: translateX(-50%) rotate(330deg); }

      .numeral {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 18px;
        height: 18px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle, #f7e7b6, #bf8c43);
        box-shadow: 0 0 0 4px rgba(15,18,24,0.75);
      }

      .hand {
        position: absolute;
        left: 50%;
        bottom: 50%;
        transform-origin: center bottom;
        border-radius: 999px;
        box-shadow: 0 0 14px rgba(255,255,255,0.12);
      }

      .hour {
        width: 8px;
        height: 90px;
        background: linear-gradient(180deg, rgba(10,14,18,1), rgba(203,157,82,1) 46%, rgba(247,232,182,1));
        transform: translateX(-50%) rotate(40deg);
      }

      .minute {
        width: 6px;
        height: 124px;
        background: linear-gradient(180deg, rgba(10,14,18,1), rgba(218,184,114,1) 40%, rgba(246,231,177,1));
        transform: translateX(-50%) rotate(120deg);
      }

      .second {
        width: 2px;
        height: 138px;
        background: linear-gradient(180deg, #f9d68d, #fff7d9);
        transform: translateX(-50%) rotate(210deg);
      }

      .center-cap {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 18px;
        height: 18px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle, #f7e4ab, #b4803b);
        box-shadow: 0 0 0 4px rgba(11,15,19,0.8);
      }

      .watch-shadow {
        position: absolute;
        width: 540px;
        height: 120px;
        bottom: 8%;
        left: 50%;
        transform: translateX(-50%);
        border-radius: 50%;
        background: radial-gradient(ellipse, rgba(0,0,0,0.6), transparent 70%);
        filter: blur(18px);
      }

      .floating-tag {
        position: absolute;
        padding: 10px 14px;
        border-radius: 999px;
        border: 1px solid rgba(247,223,157,0.18);
        background: rgba(10,14,18,0.72);
        color: var(--gold-1);
        font-size: 0.65rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        box-shadow: 0 16px 30px rgba(0,0,0,0.28);
        animation: drift 7s ease-in-out infinite;
      }

      .tag-1 { top: 11%; left: 14%; }
      .tag-2 { top: 22%; right: 10%; animation-delay: 1s; }
      .tag-3 { bottom: 18%; left: 18%; animation-delay: 2s; }
      .tag-4 { bottom: 12%; right: 17%; animation-delay: 2.5s; }

      @keyframes pulse {
        0%, 100% { transform: scale(0.92); opacity: 0.75; }
        50% { transform: scale(1.08); opacity: 1; }
      }

      @keyframes floatWatch {
        0%, 100% {
          transform: translateY(0) rotateZ(-6deg);
        }
        50% {
          transform: translateY(-22px) rotateZ(4deg);
        }
      }

      @keyframes drift {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-14px); }
      }

      @media (max-width: 700px) {
        .watch {
          width: 360px;
          height: 360px;
        }

        .watch-band {
          width: 130px;
          height: 170px;
        }

        .watch-case {
          inset: 48px 36px;
        }

        .brand {
          letter-spacing: 0.6rem;
          font-size: 0.62rem;
        }

        .floating-tag {
          font-size: 0.52rem;
          letter-spacing: 0.12em;
          padding: 8px 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <div class="watch-wrap">
        <div class="brand">Rolex</div>

        <div class="floating-tag tag-1">Swiss Made</div>
        <div class="floating-tag tag-2">Waterproof</div>
        <div class="floating-tag tag-3">Chronograph</div>
        <div class="floating-tag tag-4">Gold</div>

        <div class="watch">
          <div class="watch-shell">
            <div class="watch-band top"></div>
            <div class="watch-band bottom"></div>

            <div class="watch-case">
              <div class="bezel-ring"></div>
              <div class="watch-face">
                <div class="marker"></div>
                <div class="marker"></div>
                <div class="marker"></div>
                <div class="marker"></div>
                <div class="marker"></div>
                <div class="marker"></div>
                <div class="marker"></div>
                <div class="marker"></div>
                <div class="marker"></div>
                <div class="marker"></div>
                <div class="marker"></div>
                <div class="marker"></div>
                <div class="numeral"></div>
                <span class="hand hour"></span>
                <span class="hand minute"></span>
                <span class="hand second"></span>
                <span class="center-cap"></span>
              </div>
            </div>
          </div>
        </div>

        <div class="watch-shadow"></div>
      </div>
    </div>
  </body>
</html>
