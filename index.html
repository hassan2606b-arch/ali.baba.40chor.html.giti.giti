<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rolex 3D Luxury Watch</title>
    <style>
      :root {
        --bg-1: #04070b;
        --bg-2: #0a0d12;
        --bg-3: #0d1118;
        --gold-1: #f7dfa3;
        --gold-2: #d5ad63;
        --gold-3: #9b7030;
        --gold-4: #724d1d;
        --silver-1: #edf2fb;
        --silver-2: #a4afc1;
        --text: #edf4ff;
        --muted: #a9b6c8;
        --line: rgba(255,255,255,0.08);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background:
          radial-gradient(circle at 18% 18%, rgba(247,223,163,0.18), transparent 18%),
          radial-gradient(circle at 80% 76%, rgba(109,146,188,0.17), transparent 20%),
          linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 42%, var(--bg-3) 100%);
        color: var(--text);
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .scene {
        position: relative;
        width: min(100%, 1400px);
        height: 100vh;
        min-height: 760px;
        display: grid;
        place-items: center;
        background: transparent;
        overflow: hidden;
      }

      .scene::before,
      .scene::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        filter: blur(42px);
      }

      .scene::before {
        width: 720px;
        height: 720px;
        left: -200px;
        top: -100px;
        background: radial-gradient(circle, rgba(247,223,163,0.22), rgba(247,223,163,0.06) 35%, transparent 70%);
        animation: pulse 10s ease-in-out infinite;
      }

      .scene::after {
        width: 820px;
        height: 820px;
        right: -260px;
        bottom: -250px;
        background: radial-gradient(circle, rgba(98,128,170,0.18), rgba(98,128,170,0.06) 35%, transparent 72%);
        animation: pulse 12s ease-in-out infinite reverse;
      }

      .watch-stage {
        position: relative;
        width: min(90vw, 980px);
        height: min(82vh, 840px);
        display: grid;
        place-items: center;
        perspective: 2200px;
      }

      .watch-stage::before {
        content: "";
        position: absolute;
        width: 640px;
        height: 640px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255,255,255,0.02), transparent 68%);
      }

      .brand {
        position: absolute;
        top: 7%;
        left: 50%;
        transform: translateX(-50%);
        letter-spacing: 1.2rem;
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        color: rgba(247,223,163,0.9);
        text-shadow: 0 0 18px rgba(247,223,163,0.52);
        z-index: 30;
      }

      .float-tag {
        position: absolute;
        padding: 10px 14px;
        border-radius: 999px;
        border: 1px solid rgba(247,223,163,0.18);
        background: rgba(10,13,18,0.72);
        color: var(--gold-1);
        font-size: 0.66rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        box-shadow: 0 18px 30px rgba(0,0,0,0.2);
        animation: drift 7s ease-in-out infinite;
      }

      .tag-1 { top: 12%; left: 12%; }
      .tag-2 { top: 20%; right: 12%; animation-delay: 1.2s; }
      .tag-3 { bottom: 18%; left: 18%; animation-delay: 2.2s; }
      .tag-4 { bottom: 10%; right: 18%; animation-delay: 3.1s; }

      .watch {
        position: relative;
        width: 620px;
        height: 620px;
        transform-style: preserve-3d;
        animation: floatWatch 9s ease-in-out infinite;
      }

      .watch-shell {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        transform: rotateX(67deg) rotateY(-26deg) rotateZ(-8deg) translateZ(20px);
      }

      .band {
        position: absolute;
        left: 50%;
        width: 175px;
        height: 260px;
        transform: translateX(-50%);
        background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(9,14,20,0.8));
        border: 1px solid rgba(255,255,255,0.08);
        box-shadow: inset 0 0 18px rgba(255,255,255,0.06), 0 28px 60px rgba(0,0,0,0.35);
      }

      .band::before {
        content: "";
        position: absolute;
        inset: 18px 18px;
        border-radius: 28px;
        background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(12,17,22,0.82));
      }

      .band.top {
        top: -8px;
        border-radius: 38px 38px 18px 18px;
      }

      .band.bottom {
        bottom: -8px;
        border-radius: 18px 18px 38px 38px;
      }

      .watch-case {
        position: absolute;
        inset: 86px 72px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: linear-gradient(135deg, rgba(247,223,163,0.8), rgba(183,144,74,0.87), rgba(24,30,35,0.96));
        border: 14px solid rgba(228,198,136,0.92);
        box-shadow:
          inset 0 0 0 8px rgba(11,15,20,0.88),
          inset 0 0 0 18px rgba(255,255,255,0.12),
          0 28px 50px rgba(0,0,0,0.44),
          0 0 40px rgba(247,223,163,0.12);
        transform: translateZ(28px);
        overflow: hidden;
      }

      .watch-case::before {
        content: "";
        position: absolute;
        inset: 8px;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.16);
      }

      .watch-case::after {
        content: "";
        position: absolute;
        inset: 24px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.12);
      }

      .bezel-ring {
        position: absolute;
        inset: 16px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 24%, rgba(255,255,255,0.76), rgba(212,176,110,0.2) 26%, rgba(12,15,20,0.16) 58%, rgba(4,7,12,0.9));
        border: 1px solid rgba(255,255,255,0.18);
        box-shadow: inset 0 0 26px rgba(255,255,255,0.12), inset 0 0 34px rgba(0,0,0,0.34);
      }

      .dial {
        position: absolute;
        width: 78%;
        height: 78%;
        border-radius: 50%;
        background:
          radial-gradient(circle at 35% 30%, rgba(255,255,255,0.92), rgba(236,230,219,0.82) 10%, rgba(193,170,136,0.7) 22%, rgba(17,21,28,0.94) 63%, rgba(0,0,0,1) 100%);
        box-shadow: inset 0 0 0 3px rgba(255,255,255,0.14), inset 0 0 30px rgba(0,0,0,0.5);
        overflow: hidden;
      }

      .dial::before {
        content: "";
        position: absolute;
        inset: 18px;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.15);
      }

      .dial::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(120deg, rgba(255,255,255,0.16), transparent 22%, transparent 76%, rgba(255,255,255,0.12));
      }

      .marker {
        position: absolute;
        top: 9%;
        left: 50%;
        width: 4px;
        height: 18px;
        border-radius: 999px;
        background: linear-gradient(180deg, rgba(255,255,255,0.97), rgba(149,118,74,0.8));
        transform-origin: center 160px;
        box-shadow: 0 0 8px rgba(255,255,255,0.16);
      }

      .marker:nth-child(1) { transform: translateX(-50%) rotate(0deg); }
      .marker:nth-child(2) { transform: translateX(-50%) rotate(30deg); }
      .marker:nth-child(3) { transform: translateX(-50%) rotate(60deg); }
      .marker:nth-child(4) { transform: translateX(-50%) rotate(90deg); }
      .marker:nth-child(5) { transform: translateX(-50%) rotate(120deg); }
      .marker:nth-child(6) { transform: translateX(-50%) rotate(150deg); }
      .marker:nth-child(7) { transform: translateX(-50%) rotate(180deg); }
      .marker:nth-child(8) { transform: translateX(-50%) rotate(210deg); }
      .marker:nth-child(9) { transform: translateX(-50%) rotate(240deg); }
      .marker:nth-child(10) { transform: translateX(-50%) rotate(270deg); }
      .marker:nth-child(11) { transform: translateX(-50%) rotate(300deg); }
      .marker:nth-child(12) { transform: translateX(-50%) rotate(330deg); }

      .numeral {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 18px;
        height: 18px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle, #f7e7b6, #bd8d45);
        box-shadow: 0 0 0 4px rgba(15,18,24,0.78);
      }

      .hand {
        position: absolute;
        left: 50%;
        bottom: 50%;
        transform-origin: center bottom;
        border-radius: 999px;
      }

      .hour {
        width: 9px;
        height: 94px;
        background: linear-gradient(180deg, rgba(9,13,18,1), rgba(202,159,85,1) 48%, rgba(247,232,182,1));
        transform: translateX(-50%) rotate(38deg);
      }

      .minute {
        width: 6px;
        height: 124px;
        background: linear-gradient(180deg, rgba(9,13,18,1), rgba(218,183,110,1) 42%, rgba(246,232,180,1));
        transform: translateX(-50%) rotate(122deg);
      }

      .second {
        width: 2px;
        height: 140px;
        background: linear-gradient(180deg, #f4d179, #fff4d1);
        transform: translateX(-50%) rotate(220deg);
      }

      .center-cap {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 18px;
        height: 18px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle, #f7e4ab, #b8843a);
        box-shadow: 0 0 0 4px rgba(11,15,19,0.8);
      }

      .watch-shadow {
        position: absolute;
        width: 670px;
        height: 120px;
        bottom: 8%;
        left: 50%;
        transform: translateX(-50%);
        border-radius: 50%;
        background: radial-gradient(ellipse, rgba(0,0,0,0.72), transparent 70%);
        filter: blur(16px);
      }

      @keyframes pulse {
        0%, 100% { transform: scale(0.92); opacity: 0.76; }
        50% { transform: scale(1.08); opacity: 1; }
      }

      @keyframes floatWatch {
        0%, 100% {
          transform: translateY(0px) rotateZ(-6deg);
        }
        50% {
          transform: translateY(-22px) rotateZ(4deg);
        }
      }

      @keyframes drift {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-14px); }
      }

      @media (max-width: 800px) {
        .watch {
          width: 420px;
          height: 420px;
        }

        .brand {
          letter-spacing: 0.9rem;
          font-size: 0.68rem;
        }

        .band {
          width: 128px;
          height: 190px;
        }

        .watch-case {
          inset: 58px 42px;
        }
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <div class="watch-stage">
        <div class="brand">Rolex</div>

        <div class="float-tag tag-1">Swiss Made</div>
        <div class="float-tag tag-2">Waterproof</div>
        <div class="float-tag tag-3">Chronograph</div>
        <div class="float-tag tag-4">Gold</div>

        <div class="watch">
          <div class="watch-shell">
            <div class="band top"></div>
            <div class="band bottom"></div>

            <div class="watch-case">
              <div class="bezel-ring"></div>
              <div class="dial">
                <div class="marker"></div>
                <div class="marker"></div>
                <div class="marker"></div>
                <div class="marker"></div>
                <div class="marker"></div>
                <div class="marker"></div>
                <div class="marker"></div>
                <div class="marker"></div>
                <div class="marker"></div>
                <div class="marker"></div>
                <div class="marker"></div>
                <div class="marker"></div>
                <div class="numeral"></div>
                <span class="hand hour"></span>
                <span class="hand minute"></span>
                <span class="hand second"></span>
                <span class="center-cap"></span>
              </div>
            </div>
          </div>
        </div>

        <div class="watch-shadow"></div>
      </div>
    </div>
  </body>
</html>
